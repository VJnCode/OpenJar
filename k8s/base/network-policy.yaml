# Zero-trust-ish defaults: pods only accept traffic from pods in this namespace, and only the
# three public-facing services accept traffic from the ingress controller.
# (Enforced by CNIs with NetworkPolicy support, e.g. Calico/Cilium; kind's default CNI ignores it.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [api-gateway, user-service, frontend]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
