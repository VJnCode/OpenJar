server:
  port: ${SERVER_PORT:8081}

openjar:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  auth:
    # Browser-facing URL of the authorization server (user-service). Must equal its issuer.
    public-url: ${AUTH_ISSUER:http://localhost:8086}
    # URL the gateway itself uses to reach user-service (differs inside Docker).
    internal-url: ${AUTH_INTERNAL_URL:http://localhost:8086}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - TokenRelay=
        # Never forward the browser's session/CSRF cookies or a spoofed internal secret downstream.
        - RemoveRequestHeader=Cookie
        - RemoveRequestHeader=X-Internal-Token
      discovery:
        locator:
          # Auto-routing every registered service would expose internal endpoints. Keep explicit routes only.
          enabled: false
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        - id: recipe-service
          uri: lb://RECIPE-SERVICE
          predicates:
            - Path=/recipe, /recipe/**

        - id: social-service
          uri: lb://SOCIAL-SERVICE
          predicates:
            - Path=/api/social/**

        - id: recommendation-service
          uri: lb://RECOMMENDATION-SERVICE
          predicates:
            - Path=/api/recommendations/**

  security:
    oauth2:
      client:
        registration:
          openjar-client:
            provider: openjar
            client-id: ${OAUTH_CLIENT_ID:openjar-client}
            client-secret: ${OAUTH_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:8081/login/oauth2/code/openjar-client}
            scope: openid, profile
        provider:
          openjar:
            # Explicit endpoints (instead of issuer discovery) so the browser and the gateway
            # can reach user-service through different host names inside Docker.
            authorization-uri: ${openjar.auth.public-url}/oauth2/authorize
            token-uri: ${openjar.auth.internal-url}/oauth2/token
            jwk-set-uri: ${openjar.auth.internal-url}/oauth2/jwks
            user-name-attribute: sub

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  pattern:
    # Every line carries the X-Request-Id of the request it belongs to.
    level: "%5p [%X{requestId:-}]"
  level:
    # Per-request, per-operation and per-DB-call timings. Set any of these to OFF or DEBUG to quieten.
    openjar.timing.http: INFO
    openjar.timing.op: INFO
    openjar.timing.db: INFO

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    urls:
      - name: User Service API
        url: /api/users/v3/api-docs
      - name: Recipe Service API
        url: /recipe/v3/api-docs
      - name: Social Service API
        url: /api/social/v3/api-docs
