# All secrets come from a local .env file (copy .env.example -> .env and fill it in).
# Only the gateway (8081) and the login page of user-service (8086) are reachable from
# outside; infrastructure ports are bound to 127.0.0.1 for local debugging only.

x-common-env: &common-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:?set RABBITMQ_PASS in .env}
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
  # Browser-facing issuer (iss claim) vs. in-network address of user-service
  AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8086}
  AUTH_INTERNAL_URL: http://user-service:8086
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}

services:
  openjar-db:
    image: mysql:8.0
    container_name: openjar-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: OpenJar
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?set RABBITMQ_PASS in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5

  eureka-server:
    build: ./eureka
    container_name: eureka-server
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Identity provider. Port 8086 is public because the browser visits its login page.
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8086:8086"
    environment:
      <<: *common-env
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:mysql://openjar-db:3306/OpenJar?createDatabaseIfNotExist=true
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?set OAUTH_CLIENT_SECRET in .env}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8081/login/oauth2/code/openjar-client}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      openjar-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  recipe-service:
    build: ./recipe-service
    container_name: recipe-service
    environment:
      <<: *common-env
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://openjar-db:3306/RecipeService?createDatabaseIfNotExist=true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      openjar-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy

  social-service:
    build: ./social-service
    container_name: social-service
    environment:
      <<: *common-env
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:mysql://openjar-db:3306/openjar_social?createDatabaseIfNotExist=true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      openjar-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: notification-service
    environment:
      <<: *common-env
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:mysql://openjar-db:3306/openjar_notification?createDatabaseIfNotExist=true
      MAIL_USER: ${MAIL_USER:?set MAIL_USER in .env}
      MAIL_PASS: ${MAIL_PASS:?set MAIL_PASS in .env}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      rabbitmq:
        condition: service_healthy
      openjar-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # The single public entry point for the frontend.
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8081:8081"
    environment:
      <<: *common-env
      SERVER_PORT: 8081
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?set OAUTH_CLIENT_SECRET in .env}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8081/login/oauth2/code/openjar-client}
    depends_on:
      user-service:
        condition: service_healthy
      recipe-service:
        condition: service_healthy
      social-service:
        condition: service_healthy

volumes:
  mysql-data:

networks:
  default:
    name: openjar-network
