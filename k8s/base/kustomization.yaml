apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openjar

resources:
  - namespace.yaml
  - config.yaml
  - mysql.yaml
  - rabbitmq.yaml
  - eureka.yaml
  - user-service.yaml
  - recipe-service.yaml
  - social-service.yaml
  - notification-service.yaml
  - api-gateway.yaml
  - frontend.yaml
  - ingress.yaml
  - network-policy.yaml

# Image names are placeholders; each overlay pins the registry and tag.
images:
  - name: openjar/eureka
  - name: openjar/user-service
  - name: openjar/recipe-service
  - name: openjar/social-service
  - name: openjar/notification-service
  - name: openjar/api-gateway
  - name: openjar/frontend
