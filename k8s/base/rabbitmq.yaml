apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: openjar}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: rabbitmq}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: openjar}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-alpine
          ports:
            - {name: amqp, containerPort: 5672}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: {name: openjar-secrets, key: RABBITMQ_USER}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: openjar-secrets, key: RABBITMQ_PASS}
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 18
          livenessProbe:
            tcpSocket: {port: amqp}
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: openjar}
spec:
  selector: {app.kubernetes.io/name: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
