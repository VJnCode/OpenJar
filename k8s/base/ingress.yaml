# One public origin (http://localhost locally) for the whole app. Routing table:
#
#   /oauth2/authorization/**, /login/oauth2/code/openjar-client,
#   /logout, /api/**, /recipe(/**)            -> api-gateway   (the SPA's backend, holds the session)
#   /login, /oauth2/** (authorize, token,
#   jwks), /connect/**, /.well-known/**,
#   /userinfo, /auth-assets/**,
#   /login/oauth2/code/google                 -> user-service  (OAuth2 authorization server + login page)
#   everything else                           -> frontend      (React SPA)
#
# ingress-nginx picks Exact matches first, then the longest Prefix, so e.g.
# /oauth2/authorization/* goes to the gateway while /oauth2/authorize goes to user-service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openjar
  labels: {app.kubernetes.io/part-of: openjar}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"   # OAuth redirects carry long headers
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # ---- user-service (authorization server) ----
          - {path: /login/oauth2/code/google, pathType: Exact, backend: {service: {name: user-service, port: {name: http}}}}
          - {path: /login,                    pathType: Exact, backend: {service: {name: user-service, port: {name: http}}}}
          - {path: /oauth2,                   pathType: Prefix, backend: {service: {name: user-service, port: {name: http}}}}
          - {path: /connect,                  pathType: Prefix, backend: {service: {name: user-service, port: {name: http}}}}
          - {path: /.well-known,              pathType: Prefix, backend: {service: {name: user-service, port: {name: http}}}}
          - {path: /userinfo,                 pathType: Exact, backend: {service: {name: user-service, port: {name: http}}}}
          - {path: /auth-assets,              pathType: Prefix, backend: {service: {name: user-service, port: {name: http}}}}
          # ---- api-gateway (BFF for the SPA) ----
          - {path: /oauth2/authorization,     pathType: Prefix, backend: {service: {name: api-gateway, port: {name: http}}}}
          - {path: /login/oauth2/code,        pathType: Prefix, backend: {service: {name: api-gateway, port: {name: http}}}}
          - {path: /logout,                   pathType: Exact, backend: {service: {name: api-gateway, port: {name: http}}}}
          - {path: /api,                      pathType: Prefix, backend: {service: {name: api-gateway, port: {name: http}}}}
          - {path: /recipe,                   pathType: Prefix, backend: {service: {name: api-gateway, port: {name: http}}}}
          # ---- frontend (React SPA) ----
          - {path: /,                         pathType: Prefix, backend: {service: {name: frontend, port: {name: http}}}}
