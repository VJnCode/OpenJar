# recipe-service: generated from one template so every Java service gets the same hardening.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-service
  labels: {app.kubernetes.io/name: recipe-service, app.kubernetes.io/part-of: openjar}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: recipe-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: recipe-service, app.kubernetes.io/part-of: openjar}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: recipe-service
          image: openjar/recipe-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: openjar-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Djava.io.tmpdir=/tmp"
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/RecipeService?createDatabaseIfNotExist=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openjar-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: openjar-secrets
                  key: RABBITMQ_USER
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openjar-secrets
                  key: RABBITMQ_PASS
          resources:
            requests: {cpu: 100m, memory: 320Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # Slow JVM start + waiting for MySQL/Eureka: give it up to 5 minutes before liveness kicks in.
          startupProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          # Liveness only checks the process; a dependency outage must not cause restart loops.
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: recipe-service
  labels: {app.kubernetes.io/name: recipe-service, app.kubernetes.io/part-of: openjar}
spec:
  selector: {app.kubernetes.io/name: recipe-service}
  ports:
    - name: http
      port: 8082
      targetPort: http
