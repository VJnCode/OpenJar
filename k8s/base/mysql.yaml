# Single MySQL instance with a persistent volume; each service creates its own database on start.
# For production use a managed database (RDS / Cloud SQL) instead of running it in the cluster.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels: {app.kubernetes.io/name: mysql, app.kubernetes.io/part-of: openjar}
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mysql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mysql, app.kubernetes.io/part-of: openjar}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - {name: mysql, containerPort: 3306}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: openjar-secrets, key: MYSQL_ROOT_PASSWORD}
            - {name: MYSQL_DATABASE, value: OpenJar}
          args: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF"]
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket: {port: mysql}
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels: {app.kubernetes.io/name: mysql, app.kubernetes.io/part-of: openjar}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: mysql}
  ports:
    - {name: mysql, port: 3306, targetPort: mysql}
