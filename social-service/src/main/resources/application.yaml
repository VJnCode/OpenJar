server:
  port: ${SERVER_PORT:8087}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: social-service
  main:
    web-application-type: servlet

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/openjar_social?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_INTERNAL_URL:http://localhost:8086}/oauth2/jwks
          issuer-uri: ${AUTH_ISSUER:http://localhost:8086}

openjar:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  internal-token: ${INTERNAL_API_TOKEN:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /api/social/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    # Every line carries the X-Request-Id of the request it belongs to.
    level: "%5p [%X{requestId:-}]"
  level:
    # Per-request, per-operation and per-DB-call timings. Set any of these to OFF or DEBUG to quieten.
    openjar.timing.http: INFO
    openjar.timing.op: INFO
    openjar.timing.db: INFO
