# eureka: generated from one template so every Java service gets the same hardening.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  labels: {app.kubernetes.io/name: eureka, app.kubernetes.io/part-of: openjar}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: eureka}
  template:
    metadata:
      labels: {app.kubernetes.io/name: eureka, app.kubernetes.io/part-of: openjar}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: eureka
          image: openjar/eureka
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8761
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Djava.io.tmpdir=/tmp"
            - name: SERVER_PORT
              value: "8761"
          resources:
            requests: {cpu: 100m, memory: 320Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # Slow JVM start + waiting for MySQL/Eureka: give it up to 5 minutes before liveness kicks in.
          startupProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          # Liveness only checks the process; a dependency outage must not cause restart loops.
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: eureka
  labels: {app.kubernetes.io/name: eureka, app.kubernetes.io/part-of: openjar}
spec:
  selector: {app.kubernetes.io/name: eureka}
  ports:
    - name: http
      port: 8761
      targetPort: http
